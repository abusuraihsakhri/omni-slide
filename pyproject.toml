[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-slide"
version = "2.0.0"
description = "OmniSlide: High-performance, GPU-accelerated (CUDA) and self-healing JPEG2000 whole-slide imaging (WSI) to Pyramidal BigTIFF converter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "tifffile>=2023.0.0",
]

[project.optional-dependencies]
cuda = ["torch>=2.0.0"]
opencv = ["opencv-python>=4.8"]
glymur = ["glymur>=0.10"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
all = ["torch>=2.0.0", "opencv-python>=4.8", "glymur>=0.10"]

[project.scripts]
omni-slide = "jp2_tiff_converter.cli:cli"
omnislide = "jp2_tiff_converter.cli:cli"
jp2-tiff = "jp2_tiff_converter.cli:cli"
omni-slide-gui = "jp2_tiff_converter.gui:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jp2_tiff_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py39"